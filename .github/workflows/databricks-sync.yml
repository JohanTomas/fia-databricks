name: Sync to Databricks

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Databricks CLI v1.x
        uses: databricks/setup-cli@main

      - name: Verify CLI version
        run: databricks --version

      - name: Sync notebooks to Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks workspace import-dir databricks/notebooks /FIA-Databricks --overwrite